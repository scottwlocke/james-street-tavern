# The GitHub Pages *project* site for scottwlocke/james-street-tavern. This
# is the single source of truth for every absolute URL the site emits -
# canonicals, sitemap.xml, the Sitemap line in robots.txt, and every JSON-LD
# @id/url - and .github/workflows/hugo.yml deliberately does not override it
# on the command line, so a local build and a CI build produce the same
# bytes. Changing the repository name or moving to a custom domain means
# changing this line and nothing else.
baseURL = 'https://scottwlocke.github.io/james-street-tavern/'
locale = 'en-us'
title = 'James Street Tavern'

# This site has no taxonomies: nothing in content/ carries tags or categories.
# They must be switched off explicitly — an empty `[taxonomies]` table does NOT
# disable them, it just resets the values to empty and leaves Hugo rendering an
# unstyled /tags/ and /categories/ page. `disableKinds` is what actually turns
# those pages off. Add `tag = "tags"` under `[taxonomies]` if that changes.
disableKinds = ["taxonomy", "term"]

[outputs]
  # Two decisions in one block.
  #
  # `Robots` must be listed explicitly: `layouts/robots.txt` is only rendered
  # for an output format that is actually enabled, and Hugo does not put
  # `Robots` on the home page by default. Nothing warns about this — the
  # template is parsed (a syntax error in it still fails the build), it just
  # never emits a file, so you get a clean build and no robots.txt.
  #
  # `RSS` is deliberately absent, and so is `section` below. This site used to
  # ship 10 Atom feeds (home + 9 sections) that no page linked to, that
  # `robots.txt` does not advertise, and that nothing on the internet asked
  # for — a menu has nothing to syndicate that its HTML does not already say.
  # See SEO-Tasks.md task 8.
  #
  # Re-adding `"RSS"` to either list brings the feeds straight back; if that
  # ever becomes worth doing, advertise them too with
  # `<link rel="alternate" type="application/atom+xml">` or they are pointless
  # again.
  home = ["HTML", "Robots"]
  section = ["HTML"]

[params]
  location = "Monroeville, PA"
  address = "1224 James St, Monroeville, PA 15146"
  phone = "412-824-8884"
  email = "info@jst-tavern.com"

  # ---- Address, split for schema (partials/jsonld.html) ----
  # `address` above stays the display string the footer and contact card print.
  # schema.org PostalAddress wants the parts separate, and re-parsing that string
  # in a template would mean guessing at every comma. These four must stay
  # consistent with it — they are the same address, written twice, because the
  # two consumers need different shapes.
  streetAddress = "1224 James St"
  addressLocality = "Monroeville"
  addressRegion = "PA"
  postalCode = "15146"
  addressCountry = "US"

  # ---- Coordinates ----
  # Taken from the Google Maps embed in partials/contact.html. That URL embeds
  # them as !2d<lon>!3d<lat>; if the embed is ever swapped, re-read them from
  # the new one. Used only for LocalBusiness.geo, which is optional.
  latitude = 40.419373
  longitude = -79.808284

  # Every price in content/ is written as "$12.00". Stated once here so the
  # schema does not carry a hardcoded currency.
  priceCurrency = "USD"

  # ---- Assets (DESIGN.md §12 — <type>-<subject>-<variant>.<ext>) ----
  # Page-bundle photography follows `photo-<subject>-hero.<ext>`; layouts
  # resolve images through this glob rather than a hardcoded filename.
  photoGlob = "photo-*-hero.*"

  # ---- Hero (DESIGN.md §10 — friendly, direct, local) ----
  heroKicker = "Your Neighborhood Tavern"
  heroTitle = "Come Hungry. Leave Happy."
  heroDescription = "Jumbo whole wings, cold beer, and a wood-fired kitchen that's been feeding Monroeville for years. No frills, no nonsense — just a good time."

  # ---- Sections that are NOT part of the menu (§4 Chalkboard Panel) ----
  # Read by layouts/partials/menu-sections.html, which is the single source
  # of truth for the section list behind the homepage card grid, the mobile
  # drawer and the Full Menu page. Specials are offers rather than dishes, so
  # they stay out of all three while still being ordinary content in
  # content/specials/. Add a slug here to opt a section out; nothing else
  # needs to change.
  nonMenuSections = ["specials"]

  # ---- Menu section grid ----
  menuKicker = "The Chalkboard"
  menuTitle = "What's On Today"
  menuIntro = "Everything's made to order. If it's on the board, we've got it."
  helpBandText = "Got a big party coming, or a question about catering? Give us a call — we'll sort you out."

  # Section blurbs for the card grid, ordered by section weight so this list
  # reads in the same order the homepage renders them. These are the fallback,
  # not the first choice: layouts/partials/blurb.html resolves a blurb as the
  # page's own `description` (which already covers `summary`), then this table,
  # then a special's `lead`. A section listed here with no `description` in
  # front matter therefore always shows its blurb below — in the card *and* in
  # the meta description, which is what keeps the two from quoting different
  # text for the same section.
  [params.sections]
    pizza = "Wood-fired pies, 60 seconds in the oven."
    wings = "Jumbo whole wings, tossed in house sauce."
    appetizers = "Baskets, rings and sticks. Pass them around."
    burgers = "Half-pound Angus patties. Fries on the side."
    hoagies-sandwiches = "Steaks, sausage and cold cuts on bread."
    eggrolls = "Homemade, deep fried. Buffalo or pepperoni."
    stromboli = "Rolled and baked. Mozz and provolone."
    salads = "Cold plates, crisp greens, house dressing."

  # ---- Opening hours ----
  # Written once, in the shape schema.org needs, then rendered twice:
  # partials/contact.html prints these and partials/jsonld.html emits them as
  # openingHoursSpecification. Previously these lived as display strings here
  # *and* as literal fallbacks inside contact.html, so structured data would
  # have had to guess at them — and could only ever have parsed "3PM - 2AM"
  # back into numbers, which fails silently on the first reword.
  #   times are 24h HH:MM, which openingHoursSpecification takes verbatim;
  #     contact.html reformats to the 12h house style ("3PM", not "3:00PM").
  #   `days` is the schema.org DayOfWeek enum and feeds the schema only, since
  #     "Monday - Friday" is not something a parser can read back.
  #   `label` is the day range exactly as printed.
  # Bar and Kitchen currently carry identical times. Left as-is rather than
  # inventing a difference — worth confirming against the real roster.
  #
  # PLACEMENT IS LOAD-BEARING. This must stay below every bare `[params]` key
  # and after all `[params.*]` sub-tables. TOML assigns a bare key to whichever
  # table header most recently preceded it, so an `[[params.hours]]` array
  # parked mid-table silently absorbs every following key into its last
  # `[[params.hours.groups]]` element — turning `nonMenuSections` and
  # `photoGlob` into hours fields. Nothing errors; the keys simply vanish from
  # `.Site.Params`, and because most partials carry `| default` fallbacks the
  # site still builds and still looks plausible. That is exactly how specials
  # leaked back into the menu. Keep this block last.
  [[params.hours]]
    area = "Bar"
    [[params.hours.groups]]
      label = "Monday - Friday"
      days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
      opens = "15:00"
      closes = "02:00"
    [[params.hours.groups]]
      label = "Saturday"
      days = ["Saturday"]
      opens = "12:00"
      closes = "02:00"
    [[params.hours.groups]]
      label = "Sunday"
      days = ["Sunday"]
      opens = "12:00"
      closes = "02:00"
  [[params.hours]]
    area = "Kitchen"
    [[params.hours.groups]]
      label = "Monday - Friday"
      days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
      opens = "15:00"
      closes = "02:00"
    [[params.hours.groups]]
      label = "Saturday"
      days = ["Saturday"]
      opens = "12:00"
      closes = "02:00"
    [[params.hours.groups]]
      label = "Sunday"
      days = ["Sunday"]
      opens = "12:00"
      closes = "02:00"
