baseURL = 'https://example.org/'
locale = 'en-us'
title = 'James Street Tavern'

[taxonomies]
  tag = []
  category = []

[params]
  location = "Monroeville, PA"
  address = "1224 James St, Monroeville, PA 15146"
  phone = "412-824-8884"
  email = "info@jst-tavern.com"
  barHours = ["Monday - Friday: 3PM - 2AM", "Saturday: 12PM - 2AM", "Sunday: 12PM - 2AM"]
  restaurantHours = ["Monday - Friday: 3PM - 2AM", "Saturday: 12PM - 2AM", "Sunday: 12PM - 2AM"]

  # ---- Assets (DESIGN.md §12 — <type>-<subject>-<variant>.<ext>) ----
  # Page-bundle photography follows `photo-<subject>-hero.<ext>`; layouts
  # resolve images through this glob rather than a hardcoded filename.
  photoGlob = "photo-*-hero.*"

  # ---- Hero (DESIGN.md §10 — friendly, direct, local) ----
  heroKicker = "Your Neighborhood Tavern"
  heroTitle = "Come Hungry. Leave Happy."
  heroDescription = "Jumbo whole wings, cold beer, and a wood-fired kitchen that's been feeding Monroeville for years. No frills, no nonsense — just a good time."

  # ---- Monday Night Wings chalkboard special (§4 Chalkboard Panel) ----
  specialsKicker = "Monday Night"
  specialsTitle = "Monday Night Wings"
  specialsPrice = "$1.50"
  specialsPriceUnit = "each"
  specialsLead = "Minimum of 3 of the same flavor. Dine-in only."
  specialsDetails = [
    "Jumbo whole wings",
    "Any flavor you want",
    "Free fries with the basket",
    "Every Monday, 3PM 'til close",
  ]

  # ---- Menu section grid ----
  menuKicker = "The Chalkboard"
  menuTitle = "What's On Today"
  menuIntro = "Everything's made to order. If it's on the board, we've got it."
  helpBandText = "Got a big party coming, or a question about catering? Give us a call — we'll sort you out."

  # Section blurbs for the card grid, ordered by section weight so this list
  # reads in the same order the homepage renders them. Note the precedence is
  # the reverse of what it looks like: layouts/partials/section-card.html tries
  # a section's own `description`, then `summary`, and only falls back to these.
  # A section listed here with no front matter always shows its blurb below.
  [params.sections]
    pizza = "Wood-fired pies, 60 seconds in the oven."
    wings = "Jumbo whole wings, tossed in house sauce."
    appetizers = "Baskets, rings and sticks. Pass them around."
    burgers = "Half-pound Angus patties. Fries on the side."
    hoagies-sandwiches = "Steaks, sausage and cold cuts on bread."
    eggrolls = "Homemade, deep fried. Buffalo or pepperoni."
    stromboli = "Rolled and baked. Mozz and provolone."
    salads = "Cold plates, crisp greens, house dressing."
