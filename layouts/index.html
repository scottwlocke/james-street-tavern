{{ define "main" }}
  {{ partial "hero.html" . }}

  <section id="menu" class="section-cloud">
    <div class="container">
      {{ $sections := where .Site.Sections "Kind" "section" }}
      {{ if $sections }}
        {{ range $sections }}
          {{ partial "menu-section.html" (dict "section" .) }}
        {{ end }}
      {{ end }}
    </div>
  </section>

  {{ partial "contact.html" . }}
{{ end }}
