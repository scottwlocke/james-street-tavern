{{ $item := .item }}
{{ $image := "" }}
{{ with $item.Resources.GetMatch "hero.*" }}
  {{ $image = .RelPermalink }}
{{ end }}

<a class="card" href="{{ $item.RelPermalink }}">
  <div class="card-media">
    {{ with $image }}
      <img src="{{ . }}" alt="" loading="lazy" aria-hidden="true">
    {{ else }}
      <span class="card-media-empty" aria-hidden="true"></span>
    {{ end }}
  </div>
  <div class="menu-header">
    <span class="menu-name">{{ $item.Title }}</span>
    {{ with $item.Params.price }}
      <span class="menu-price">{{ . }}</span>
    {{ end }}
  </div>
  {{ with $item.Params.description }}
    <p class="menu-desc">{{ . }}</p>
  {{ end }}
</a>
