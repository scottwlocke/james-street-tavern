<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.heroDescription }}{{ end }}">
<meta name="theme-color" content="#1A1A1A">
<link rel="icon" href="{{ "images/jst-logo.png" | relURL }}" type="image/png">
<link rel="apple-touch-icon" href="{{ "images/jst-logo.png" | relURL }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Permanent+Marker&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
{{- /* Served through Hugo's asset pipeline with a content fingerprint, so the
       URL changes whenever the CSS changes and a browser can never reuse a
       stale stylesheet. DESIGN.md is the only design spec. */ -}}
{{- $css := resources.Get "css/style.css" | fingerprint "sha256" -}}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
