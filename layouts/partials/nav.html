<header class="nav-bar">
  <div class="container">
    <a href="{{ .Site.BaseURL }}" class="logo">
      <span class="logo-mark">🍕</span>
      <span class="logo-text">{{ .Site.Title }}</span>
    </a>
    <ul class="nav-links">
      <li><a href="{{ .Site.BaseURL }}" {{ if .IsHome }}class="active"{{ end }}>Home</a></li>
      <li><a href="#menu" {{ if eq .Section "menu" }}class="active"{{ end }}>Menu</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobile-nav">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
  </div>
</header>

<div id="mobile-nav" class="mobile-nav" aria-hidden="true">
  <ul class="mobile-nav-links">
    <li><a href="{{ .Site.BaseURL }}">Home</a></li>
    <li><a href="#menu">Menu</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</div>
