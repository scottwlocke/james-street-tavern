{{ define "main" }}
  <section class="section">
    <div class="container">
      <div class="section-header">
        <span class="section-kicker">Menu</span>
        <h1 class="section-title">{{ .Title }}</h1>
        {{ with .Params.description }}
          <p class="section-intro">{{ . }}</p>
        {{ end }}
      </div>

      {{ with .Content }}
        <div class="section-intro">{{ . }}</div>
      {{ end }}

      {{ if .Pages }}
        <div class="menu-grid">
          {{ partial "menu-grid-items.html" .Pages }}
        </div>
      {{ else }}
        <p class="menu-desc">Nothing on this part of the board yet. Check back soon.</p>
      {{ end }}
    </div>
  </section>
{{ end }}
